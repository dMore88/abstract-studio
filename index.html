<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abstract Studio - Parametric Design & Generative Art</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
  <!-- Phosphor Icons (Regular & Fill weights) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="dot-grid-bg">

  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand">
      <button class="brand-menu-btn" id="btn-brand-menu" title="Menu" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="brand-title">Abstract Studio</span>
    </div>

    <div class="topbar-actions">
      <!-- Random / Harmonically Mutate -->
      <button id="btn-mutate" class="topbar-pill-btn" title="Harmonically mutate layer parameters">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
        <span>Random</span>
      </button>

      <!-- Config (View JSON State) -->
      <button id="btn-view-code" class="topbar-pill-btn" title="View configuration export">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Config</span>
      </button>

      <!-- Copy SVG -->
      <button id="btn-copy-svg" class="topbar-pill-btn" title="Copy pure vector SVG to clipboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span>Copy SVG</span>
      </button>

      <!-- Download SVG -->
      <button id="btn-download-svg" class="topbar-pill-btn" title="Download vector .svg file">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>Download SVG</span>
      </button>
    </div>
  </header>

  <!-- Workspace Container -->
  <div class="workspace">

    <!-- FLOATING LEFT: LAYERS PANEL -->
    <aside class="layers-panel" id="layers-sidebar">
      <!-- Dynamically generated by UIManager -->
    </aside>

    <!-- CENTER: CANVAS VIEWPORT -->
    <main class="canvas-viewport">
      
      <!-- Canvas Header Bar: Aspect Ratio & Helpers -->
      <div class="canvas-header-bar">
        <!-- Aspect Ratio Pill -->
        <div class="aspect-pill-container">
          <select id="canvas-aspect-ratio" class="aspect-pill-select" title="Canvas Aspect Ratio">
            <option value="1:1" selected>1 : 1</option>
            <option value="9:16">9 : 16</option>
            <option value="16:9">16 : 9</option>
            <option value="4:5">4 : 5</option>
            <option value="4:3">4 : 3</option>
          </select>
          <div class="aspect-pill-arrow">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <!-- Quick actions: Bounds & Invert -->
        <div class="canvas-quick-actions">
          <button id="studio-bounds-toggle" class="btn-circle-action" title="Toggle Bounds Grid">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
          </button>
          <button id="studio-invert-toggle" class="btn-circle-action" title="Invert Figure / Ground">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20Z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <!-- Canvas Artboard Card -->
      <div class="canvas-card-wrapper">
        <div class="canvas-artboard-card">
          <canvas id="studio-canvas" class="studio-canvas" width="800" height="800"></canvas>
        </div>
      </div>

      <!-- Floating Zoom Pill -->
      <div class="floating-zoom-bar">
        <button id="btn-zoom-out" class="zoom-btn" title="Zoom out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="btn-zoom-reset" class="zoom-btn" title="Reset zoom (100%)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button id="btn-zoom-in" class="zoom-btn" title="Zoom in">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <!-- Canvas Status Bar -->
      <div class="canvas-status-footer">
        <span id="studio-resolution-text">800 × 800 PX • 2 LAYERS • RETINA HiDPI</span>
      </div>
    </main>

    <!-- FLOATING POPOVER INSPECTOR CARD (Flyout Panel) -->
    <div class="popover-inspector" id="popover-inspector">
      <!-- Dynamically rendered based on active panel (shape / pattern / style) -->
    </div>

    <!-- RIGHT EDGE: VERTICAL TOOL RAIL -->
    <aside class="tool-rail" id="tool-rail">
      <!-- 3 active icon buttons for now, others hidden for future proposals -->
      <button class="rail-btn" data-panel="shape" title="Shape">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      </button>

      <button class="rail-btn" data-panel="pattern" title="Distribution & Pattern">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/></svg>
      </button>

      <button class="rail-btn" data-panel="style" title="Appearance & Style">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.563C22 6.5 17.5 2 12 2z"/></svg>
      </button>

      <!-- Hidden buttons reserved for subsequent iterations -->
      <button class="rail-btn hidden-rail-btn" data-panel="transform" title="Transform (Hidden)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v16h16"/></svg></button>
      <button class="rail-btn hidden-rail-btn" data-panel="texture" title="Texture (Hidden)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
      <button class="rail-btn hidden-rail-btn" data-panel="sculpt" title="Sculpt (Hidden)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></button>
    </aside>

  </div>

  <!-- Modal for Exporting / Viewing Code -->
  <div id="modal-code" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Exportable Artwork Configuration</h3>
        <button id="btn-close-modal" class="btn-icon-sm" title="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <pre class="code-container"><code id="code-snippet"></code></pre>
      </div>
      <div class="modal-footer">
        <button id="btn-copy-code-modal" class="btn btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
          <span>Copy Configuration</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
